name: Manual npm package family release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact v<version> tag for both packages
        required: true
        type: string
      expected_sha:
        description: Full 40-character source commit SHA resolved by that tag
        required: true
        type: string

permissions: {}

concurrency:
  group: yurucommu-core-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'tako0614/yurucommu-core'
    runs-on: ubuntu-24.04
    environment: npm-release
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      YURUCOMMU_NPM_RELEASE_ENVIRONMENT: npm-release
      YURUCOMMU_EXPECTED_RELEASE_TAG: ${{ inputs.release_tag }}
      YURUCOMMU_EXPECTED_RELEASE_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate manual input syntax before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$YURUCOMMU_EXPECTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$YURUCOMMU_EXPECTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag and source before executing repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$YURUCOMMU_EXPECTED_RELEASE_SHA"
          test "$(git rev-parse --verify "refs/tags/$YURUCOMMU_EXPECTED_RELEASE_TAG^{commit}")" = "$YURUCOMMU_EXPECTED_RELEASE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4.4.0 (2026)
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Pin npm with native trusted publishing support
        run: npm install --global npm@11.5.1 --ignore-scripts --no-audit --no-fund

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install exact locked dependencies without release cache
        run: bun install --frozen-lockfile

      - name: Publish only through the owning package-family entrypoint
        run: bun run deploy -- yurucommu-package-family
